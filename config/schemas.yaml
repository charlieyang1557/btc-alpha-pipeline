# schemas.yaml — Data Schema Definitions
# Defines required columns, dtypes, and constraints for all data tables.
# Used by validators.py to verify data integrity.
# Last reviewed: 2026-04-15

ohlcv:
  description: "Hourly OHLCV candle data for BTC/USDT"
  primary_key: "open_time_utc"
  sort_order: "open_time_utc ASC"
  file_pattern: "data/raw/btcusdt_1h.parquet"  # canonical current dataset (overwritten by reconcile.py)
  # Pre-reconcile snapshots archived to: data/raw/archive/btcusdt_1h_YYYYMMDDTHHMMSSZ.parquet

  columns:
    open_time_utc:
      dtype: "datetime64[ms, UTC]"
      nullable: false
      description: "Candle open timestamp, UTC timezone-aware, aligned to hour boundary"
    open:
      dtype: "float64"
      nullable: false
      constraints: "> 0"
      description: "Open price in USDT"
    high:
      dtype: "float64"
      nullable: false
      constraints: "> 0, >= open, >= close"
      description: "Highest price in USDT during candle"
    low:
      dtype: "float64"
      nullable: false
      constraints: "> 0, <= open, <= close"
      description: "Lowest price in USDT during candle"
    close:
      dtype: "float64"
      nullable: false
      constraints: "> 0"
      description: "Close price in USDT"
    volume:
      dtype: "float64"
      nullable: false
      constraints: ">= 0"
      description: "Base asset volume (BTC traded)"
    quote_volume:
      dtype: "float64"
      nullable: false
      constraints: ">= 0"
      description: "Quote asset volume (USDT traded)"
    trade_count:
      dtype: "int64"
      nullable: false
      constraints: ">= 0"
      description: "Number of trades executed during candle"
    ingested_at_utc:
      dtype: "datetime64[ms, UTC]"
      nullable: false
      description: "Timestamp when this row was written to the dataset"
    source:
      dtype: "string"
      nullable: false
      allowed_values: ["binance_vision", "ccxt_binance", "ccxt_binanceus"]
      description: >
        Data provenance: acquisition method + venue.
        "binance_vision" = bulk historical archive from Binance global.
        "ccxt_binance" = CCXT API against Binance global (live incremental).
        "ccxt_binanceus" = CCXT API against Binance.US (separate venue,
        different liquidity — must NOT be merged with Binance global data).

  validation_rules:
    - name: "no_duplicates"
      check: "open_time_utc is unique"
    - name: "no_gaps"
      check: "consecutive open_time_utc differ by exactly 3600000ms"
      severity: "warning"  # gaps are flagged, not fatal
    - name: "hour_aligned"
      check: "open_time_utc minute=0, second=0, microsecond=0"
    - name: "ohlc_consistency"
      check: "high >= max(open, close) AND low <= min(open, close)"
    - name: "no_null_core_fields"
      check: "no NaN/None in open, high, low, close, volume, quote_volume, trade_count"
    - name: "price_sanity"
      check: "abs(close / prev_close - 1) < 0.50"
      severity: "warning"  # flag only, do NOT auto-remove; extreme moves are real in crypto
    - name: "volume_anomaly"
      check: "volume > 0 or flagged in quality report"
      severity: "warning"

# Mirrors the existing `ohlcv` block structure exactly: columns is a NAME-KEYED
# MAPPING (not a list), source allowed values live under the source column's
# allowed_values, validation_rules is a list of {name, check, severity?}.
funding:
  description: "Binance USDT-M perpetual funding rate, 8h settlement series for BTCUSDT"
  primary_key: "open_time_utc"
  sort_order: "open_time_utc ASC"
  file_pattern: "data/raw/btcusdt_funding_8h.parquet"
  columns:
    open_time_utc:
      dtype: "datetime64[ms, UTC]"
      nullable: false
      description: "Settlement time (calc_time), UTC tz-aware, unique, sorted ascending"
    funding_rate:
      dtype: "float64"
      nullable: false
      description: "last_funding_rate (settled realized rate) for the interval ending at open_time_utc"
    funding_interval_hours:
      dtype: "int64"
      nullable: false
      constraints: "> 0"
      description: "Funding interval hours, read per-row (8 for BTCUSDT over the window; never hardcoded)"
    ingested_at_utc:
      dtype: "datetime64[ms, UTC]"
      nullable: false
      description: "Timestamp when this row was written"
    source:
      dtype: "string"
      nullable: false
      allowed_values: ["binance_vision", "ccxt_binance"]
      description: "Provenance: binance_vision (bulk) | ccxt_binance (incremental)"
  validation_rules:
    - name: "no_duplicates"
      check: "open_time_utc is unique"
    - name: "sorted_pk"
      check: "open_time_utc strictly ascending"
    - name: "utc_tz_aware"
      check: "open_time_utc is timezone-aware UTC"
    - name: "positive_interval"
      check: "funding_interval_hours > 0"
    - name: "no_forward_fill"
      check: "missing settlements flagged in the quality report, never interpolated"
      severity: "warning"

# Mirrors the existing `ohlcv` block structure exactly: columns is a NAME-KEYED
