execution:
  signal_timing: "bar_close"
  fill_timing: "next_bar_open"
  stop_limit_intrabar: "adverse_first"

cost_model:
  name: "phaseb_spot_realistic_15bps"
  maker_fee_bps: 2.0
  taker_fee_bps: 10.0
  default_fee_bps: 10.0
  slippage_bps: 5.0

zero_volume:
  treatment: "flag_only"

position:
  max_position_pct: 1.0
  default_position_pct: 1.0
  max_leverage: 1.0

timezone:
  canonical: "UTC"

timeframe:
  primary: "1h"
