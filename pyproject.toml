[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-alpha-pipeline"
version = "0.1.0"
description = "BTC quantitative research and trading pipeline"
requires-python = ">=3.11"

dependencies = [
    # === Phase 0: Data Infrastructure ===
    "pandas~=2.2.0",
    "numpy~=1.26.0",
    "pyarrow~=15.0.0",        # Parquet read/write
    "ccxt~=4.0.0",             # Exchange API (incremental updates)
    "requests~=2.31.0",        # HTTP for Binance Vision downloads
    "pyyaml~=6.0",             # Config file parsing

    # === Phase 1: Backtesting ===
    # "backtrader~=1.9.78",    # Uncomment when entering Phase 1
    # "matplotlib~=3.8.0",     # Backtrader plotting
    # "scipy~=1.12.0",         # Statistical tests

    # === Phase 2: AI Agents ===
    # "anthropic~=0.40.0",     # Claude API
    # "vectorbt~=0.26.0",      # Quick factor scanning

    # === Phase 4: Paper/Live Trading ===
    # "websockets~=12.0",      # Live data feeds
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",            # Linting + formatting
    "ipython>=8.0.0",         # Interactive exploration
    "scipy>=1.12.0",          # Required at test register by Phase 4 closeout
                              # machinery (binomial threshold sanity checks)
                              # + Phase 2C statistical-significance machinery
                              # consumers under tests/.
]

phase1 = [
    "backtrader>=1.9.78",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
]

phase2 = [
    "anthropic>=0.40.0",
    "vectorbt>=0.26.0",
    "pydantic~=2.0",           # DSL schema validation (D2)
]

# Phase 2.5 — combined factor bandit + semantic dedup parked work
# (parked branch phase2.5/bandit-dedup; activation gated by future
# Charlie register-event boundary establishing batch cadence resumption).
# Per sub-spec SEAL ab8e715 B-Lock-7: version-pinned + local CPU only +
# no runtime network egress. Model + tokenizer artifact SHA pinning
# happens at first install via Wave 0 W0.3 model-cache setup
# (project-local cache directory; checksum recorded at calibration).
phase2_5 = [
    "sentence-transformers>=2.7.0,<6.0.0",  # short-text embedding model
    "torch>=2.0.0",                          # CPU inference backend
    "numpy>=1.24.0",                         # already-implicit via other deps
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
